# Start with an explicit project name to keep this deployment independent:
#   docker compose -p vvz-1csrv-postgres-8327 -f docker-compose.8.3.27.yml up -d
services:
  app:
    restart: unless-stopped
    hostname: devel1c8327
    build:
      context: .
      dockerfile: Dockerfile.8.3.27
    image: vasilyvz/vvz-1csrv-postgres:8.3.27.2214
    ports:
      - "1640:1640"
      - "1641:1641"
      - "1660-1691:1660-1691"
    environment:
      ONEC_VERSION: 8.3.27.2214
      PGDATA: /var/lib/pgpro/std-16/data
      INIT_PGDATA: "0"
      PGSQL1C_DOCKER_SUBNET: 172.30.0.0/16
      PGSQL1C_PGHBA_MODE: managed
      PGSQL1C_PGHBA_AUTH_METHOD: md5
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["/usr/local/bin/start-stack-8.3.27.sh"]
    stdin_open: true
    tty: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    volumes:
      - /var/pgsql1c-8327/postgres:/var/lib/pgpro/std-16/data
      - /var/log/pgsql1c-8327:/var/log/1cv8
      - /var/pgsql1c-8327/1cv8:/home/usr1cv8/.1cv8
      - /var/pgsql1c-8327/cache/cfstorage:/var/cfstorage
      - /var/pgsql1c-8327/cache/app:/var/cache/1cv8
      - /etc/pgsql1c-8327/conf.d:/var/lib/pgpro/std-16/data/conf.d
      - /var/pgsql1c-8327/backups:/var/backups/pgsql
      - ./docker/8.3.27/srv1cv83:/etc/default/srv1cv83:ro
      # Add after the active working-copy file is identified:
      # - /etc/pgsql1c-8327/nethasp.ini:/opt/1cv8/conf/nethasp.ini:ro
    networks:
      pgsql1c_8327_net:
        ipv4_address: 172.30.0.2

networks:
  pgsql1c_8327_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
